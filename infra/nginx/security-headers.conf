# Include in every server block AND in every location that has its own add_header
# (nginx drops inherited add_header directives as soon as a location defines one).
#
# Cross-Origin-Resource-Policy is set per-URI in site.conf.example (public keys/signatures are cross-origin).
#
# CSP is the strict target. Once the site is integrated, add only the exact origins it needs, e.g.:
#   connect-src  + the Sentry ingest host          media-src + the podcast audio host
#   script-src   + 'nonce-...' if the CMS needs inline scripts (never 'unsafe-inline')

add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; media-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
