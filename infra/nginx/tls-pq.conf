# Post-quantum TLS. Include inside each `server { listen 443 ssl; ... }` block.
# Requires nginx built against OpenSSL >= 3.5 (check: `nginx -V 2>&1 | grep -o 'OpenSSL [0-9.]*'`).
# On an older OpenSSL, nginx refuses to start on the group names below; that is deliberate (fail loud, not silently classical).

ssl_protocols TLSv1.3;

# Key exchange (protects against harvest-now-decrypt-later).
# Tuple 1 = hybrid ML-KEM groups; tuple 2 = classical fallback for clients with no PQ support.
# With server preference, a client that supports any tuple-1 group is forced onto it (via HelloRetryRequest if needed),
# so an attacker cannot downgrade a PQ-capable client. Browsers currently negotiate X25519MLKEM768;
# SecP384r1MLKEM1024 (ML-KEM-1024) is chosen for clients that offer it.
# Strict PQ-only mode: delete "/X25519:secp384r1" (clients without PQ support will then fail to connect).
ssl_ecdh_curve SecP384r1MLKEM1024:X25519MLKEM768:SecP256r1MLKEM768/X25519:secp384r1;
ssl_prefer_server_ciphers on;

# Bulk encryption: AES-256-GCM first; ChaCha20-Poly1305 (also a 256-bit key) for devices without AES hardware.
ssl_conf_command Ciphersuites TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256;

# Certificate: ECDSA P-384 (public CAs do not issue post-quantum certificates yet).
#   certbot certonly --key-type ecdsa --elliptic-curve secp384r1 -d example.com -d www.example.com
ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

# Forward secrecy: no long-lived ticket keys; no 0-RTT (replayable).
ssl_session_tickets off;
ssl_session_cache shared:TLS:10m;
ssl_session_timeout 1h;
ssl_early_data off;
