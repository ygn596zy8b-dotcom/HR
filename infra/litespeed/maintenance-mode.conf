# BEGIN Headline Recorder maintenance
# ---------------------------------------------------------------------------------------------------------------
# Server-level maintenance page: works with no PHP at all (PHP being updated, patched or broken).
# Shows /maintenance.html with HTTP 503 + Retry-After to every visitor, except the IP addresses you allowlist.
# Works on LiteSpeed (cPanel) and Apache 2.4 (mod_rewrite, mod_headers). docs/MAINTENANCE.md has the full steps.
#
# INSTALL (once):
#   1. cPanel > File Manager > public_html. Turn on Settings > "Show Hidden Files" to see .htaccess.
#   2. Check that public_html/maintenance.html exists (the theme installer copies it there; the source is
#      deploy/webroot/maintenance.html, also in the theme at bundled/webroot/maintenance.html).
#   3. Edit .htaccess and paste this whole block at the VERY TOP, above every other block (above "# BEGIN LSCACHE"
#      and "# BEGIN WordPress"). Rules placed below "# BEGIN WordPress" never run.
#   4. Replace 203.0.113.10 below with your own IP address (search "what is my IP"), or delete those two lines.
#   Pasting the block changes nothing yet: it does nothing until the switch file exists.
#
# TURN ON:  create an empty file named  hr-maintenance.on  in public_html (File Manager: + File).
# TURN OFF: delete (or rename) hr-maintenance.on. The site is back at once.
# REMOVE:   delete everything from "# BEGIN Headline Recorder maintenance" to "# END Headline Recorder maintenance".
# wp-admin > Maintenance > "Server-level page" does all of the above with one button while WordPress works.
#
# Who still gets through while it is on:
#   - the allowlisted IP addresses (checked both as the connecting address and as Cloudflare's CF-Connecting-IP
#     header; a forged header could only reveal the normal site to a visitor, nothing more);
#   - /wp-admin/, /wp-login.php, /wp-includes/ and /wp-content/ (so administrators can sign in and check the site
#     when PHP works; delete that RewriteCond line to close them too);
#   - /.well-known/ (TLS certificate renewal, security.txt, the signing keyset).
# Search engines see 503 + Retry-After and keep rankings. Cloudflare may keep serving pages it already has in its
# cache (stale-if-error); that is fine during an outage.
# ---------------------------------------------------------------------------------------------------------------
<IfModule mod_rewrite.c>
RewriteEngine On
# The page itself is always served as is (no loop when the server fetches it as the 503 error page).
RewriteRule ^maintenance\.html$ - [L]
# The switch: nothing below applies unless this file exists.
RewriteCond %{DOCUMENT_ROOT}/hr-maintenance.on -f
RewriteCond %{REQUEST_URI} !^/(wp-admin|wp-includes|wp-content|\.well-known)/
RewriteCond %{REQUEST_URI} !^/wp-login\.php
# Allowlisted IP (one pair of lines per address; dots escaped with a backslash).
RewriteCond %{REMOTE_ADDR} !^203\.0\.113\.10$
RewriteCond %{HTTP:CF-Connecting-IP} !^203\.0\.113\.10$
RewriteRule ^ - [R=503,L]
</IfModule>
# Any 503 the web server gives (this rule, or LiteSpeed when PHP is down) shows the designed page.
ErrorDocument 503 /maintenance.html
<IfModule mod_headers.c>
# Search engines: come back in an hour. Never store the 503 in any cache.
Header always set Retry-After "3600" "expr=%{REQUEST_STATUS} == 503"
Header always set Cache-Control "no-store" "expr=%{REQUEST_STATUS} == 503"
</IfModule>
# END Headline Recorder maintenance
