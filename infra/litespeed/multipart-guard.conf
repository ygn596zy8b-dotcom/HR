# BEGIN Headline Recorder multipart guard (opt-in, php2shell defence in depth)
# CVE-2026-109619 is a bug in PHP's multipart/form-data parser, which runs before WordPress for ANY .php request.
# Updating PHP (8.4.27+) is the real fix. This block shrinks the attack surface until then: it refuses
# multipart uploads from visitors who are not signed in, except on the few addresses that genuinely need them.
# Enable: paste at the TOP of public_html/.htaccess (below the hardening block). Undo: delete this block.
# If a form on the site stops working, add its page path to the allowlist line below.
<IfModule mod_rewrite.c>
    RewriteEngine On
    RewriteCond %{REQUEST_METHOD} =POST
    RewriteCond %{HTTP:Content-Type} multipart/form-data [NC]
    # Signed-in staff and readers keep working everywhere (media uploads, profile photos).
    RewriteCond %{HTTP_COOKIE} !wordpress_logged_in_ [NC]
    # Allowlist: admin, login, Contact Form 7 (REST and no-JS page posts), PR & Media, contact page.
    RewriteCond %{REQUEST_URI} !^/(wp-admin/|wp-login\.php|wp-json/contact-form-7/|contact-us/?|pr-media/?) [NC]
    RewriteRule ^ - [F,L]
</IfModule>
# END Headline Recorder multipart guard
