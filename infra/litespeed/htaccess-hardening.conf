# BEGIN Headline Recorder hardening
# Paste at the TOP of public_html/.htaccess (above "# BEGIN WordPress"). LiteSpeed reads Apache syntax.
# Replaces the block written by the "Headers Security Advanced & HSTS WP" plugin: deactivate that plugin first,
# otherwise its weaker headers (COOP unsafe-none, CORP cross-origin, HSTS without includeSubDomains) override these.
# Test after saving: curl -sI https://headlinerecorder.com/ | grep -iE 'strict|content-security|x-frame|referrer|permissions'

Options -Indexes -MultiViews
ServerSignature Off
# TraceEnable is a server-level directive: Apache answers HTTP 500 for every request when it appears in .htaccess.
# TRACE and TRACK are refused by the rewrite rule further down instead.

# --- php2shell interim mitigation (CVE-2026-109618, October 2026) --------------------------------------------
# The real fix is a patched PHP (8.4.27 or later); see docs/DEPLOY.md "Security update, October 2026".
# public_html/.user.ini (deploy/webroot/.user.ini, merged by the theme installer) already turns this off for
# PHP-FPM, CGI and LiteSpeed LSAPI. The lines below repeat it for setups where PHP runs inside the web server.
# php_flag must ONLY appear inside these blocks: Apache with PHP-FPM/CGI does not know the directive and answers
# every request with HTTP 500.
#   <IfModule LiteSpeed>  is how LiteSpeed Cache itself detects LiteSpeed. LiteSpeed passes php_flag to LSAPI PHP
#                         (lsphp). We could not confirm how every LiteSpeed build treats it when PHP is not LSAPI:
#                         if the site shows HTTP 500 after pasting this, delete this LiteSpeed block and rely on
#                         .user.ini.
#   <IfModule mod_php.c> / <IfModule php_module>  Apache with mod_php (PHP 8). Both names are checked because
#                         IfModule accepts either the source file or the module id; a duplicate flag is harmless.
<IfModule LiteSpeed>
    php_flag session.upload_progress.enabled off
</IfModule>
<IfModule mod_php.c>
    php_flag session.upload_progress.enabled off
</IfModule>
<IfModule php_module>
    php_flag session.upload_progress.enabled off
</IfModule>

# --- Security headers on every response, static files included -------------------------------------------------
# (PHP pages also get a Content-Security-Policy from wp-content/mu-plugins/hr-hardening.php; CSP only matters for
#  documents, so it is not repeated here.)
<IfModule mod_headers.c>
    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" "expr=%{HTTPS} == 'on'"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Cross-Origin-Opener-Policy "same-origin-allow-popups"
    Header always set X-Permitted-Cross-Domain-Policies "none"
    Header always set Permissions-Policy "accelerometer=(), autoplay=(self), browsing-topics=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), hid=(), magnetometer=(), microphone=(), midi=(), payment=(), publickey-credentials-create=(self), publickey-credentials-get=(self), serial=(), usb=(), xr-spatial-tracking=()"
    Header always unset X-Powered-By
    Header unset X-Powered-By
    # Signatures and the public signing keyset are fetched by partners' tools from other origins.
    <FilesMatch "(\.sig|^pqsig-keys)\.json$">
        Header always set Access-Control-Allow-Origin "*"
        Header always set Cross-Origin-Resource-Policy "cross-origin"
    </FilesMatch>
</IfModule>

<IfModule mod_rewrite.c>
    RewriteEngine On

    # --- One canonical origin: HTTPS, no www ----------------------------------------------------------------------
    RewriteCond %{HTTPS} off [OR]
    RewriteCond %{HTTP_HOST} ^www\. [NC]
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://headlinerecorder.com%{REQUEST_URI} [L,R=301,NE]

    # --- Refuse dangerous methods -----------------------------------------------------------------------------------
    RewriteCond %{REQUEST_METHOD} ^(TRACE|TRACK|DEBUG|CONNECT)$ [NC]
    RewriteRule ^ - [F]

    # --- XML-RPC is not used (no Jetpack/app). Refuse at the edge so PHP never starts. ------------------------------
    RewriteRule ^xmlrpc\.php$ - [F,L]

    # --- Backups, archives, logs, dumps and installers must never be downloadable -----------------------------------
    RewriteRule ^wp-content/(duplicator-backups|ai1wm-backups|aiowps_backups|upgrade-temp-backup|backups?|uploads/hr-sealed|litespeed/debug)(/|$) - [F,L]
    RewriteRule ^wp-content/(?!uploads/).*\.(zip|tar|tgz|gz|rar|7z|daf|wpress)$ - [F,L,NC]
    RewriteRule (^|/)(error_log|debug\.log|php_errorlog|\.user\.ini|installer(-backup)?\.php(\.bak)?)$ - [F,L,NC]
    RewriteRule \.(sql|sqlite|db|bak|old|orig|save|swp|dist|log|ini|sh|env)$ - [F,L,NC]

    # --- Source maps, build manifests and key files; nothing on the site needs them ---------------------------------
    RewriteRule \.(map|secret\.json)$ - [F,L,NC]
    RewriteRule (^|/)(composer\.(json|lock)|package(-lock)?\.json|readme\.html|license\.txt|wp-config-sample\.php)$ - [F,L,NC]

    # --- No PHP execution in uploads (a classic web-shell path) -----------------------------------------------------
    RewriteRule ^wp-content/uploads/.*\.(php\d?|phtml|phar|pht|phps)$ - [F,L,NC]

    # --- Hidden files and VCS metadata (but keep /.well-known/ working for ACME and the signing keyset) -------------
    RewriteRule (^|/)\.(?!well-known/) - [F,L]
</IfModule>

# wp-config.php and .htaccess themselves
<FilesMatch "^(wp-config\.php|\.htaccess|\.htpasswd)$">
    <IfModule mod_authz_core.c>
        Require all denied
    </IfModule>
</FilesMatch>

# Request size: AIOS already sets LimitRequestBody 100 MB (podcast MP3 uploads need room). The application caps
# reader submissions at 16 MB itself.

# The feed stylesheet (hr-platform/assets/xsl/feed.xsl, attached to the RSS feeds as an XSLT stylesheet) must be
# served as XML, or browsers refuse to apply it.
# The feeds link it with ?ver=<mtime>, so it is cached like the other versioned assets. Matched by file name, not
# by type: ExpiresByType application/xml would also give the PHP feeds and sitemaps a long browser lifetime.
<IfModule mod_mime.c>
    AddType application/xml .xsl
</IfModule>
<IfModule mod_headers.c>
    <FilesMatch "\.xsl$">
        Header set Cache-Control "public, max-age=31536000"
    </FilesMatch>
</IfModule>

# Long-lived caching for versioned static assets (every theme/plugin asset carries ?ver=<mtime>).
<IfModule mod_expires.c>
    ExpiresActive On
    ExpiresByType text/css "access plus 1 year"
    ExpiresByType application/javascript "access plus 1 year"
    ExpiresByType image/svg+xml "access plus 1 year"
    ExpiresByType image/webp "access plus 1 year"
    ExpiresByType image/avif "access plus 1 year"
    ExpiresByType font/woff2 "access plus 1 year"
</IfModule>
# END Headline Recorder hardening
