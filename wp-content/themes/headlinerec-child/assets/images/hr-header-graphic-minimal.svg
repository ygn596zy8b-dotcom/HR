<svg width="640" height="160" viewBox="0 0 640 160" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
    </filter>
  </defs>

  <!-- quiet ascending line, smooth, low-opacity -->
  <path d="M 40,118 C 140,108 180,96 260,90 S 380,64 440,58 S 560,40 600,34"
    fill="none" stroke="#FFFFFF" stroke-width="1.3" stroke-linecap="round" opacity="0.30"/>

  <!-- two faint waypoint ticks, barely there -->
  <circle cx="260" cy="90" r="2" fill="#FFFFFF" opacity="0.28"/>
  <circle cx="440" cy="58" r="2" fill="#FFFFFF" opacity="0.28"/>

  <!-- soft red glow behind the live-point -->
  <circle cx="600" cy="34" r="13" fill="#E1261C" opacity="0.16" filter="url(#softGlow)"/>

  <!-- live endpoint -->
  <circle cx="600" cy="34" r="3.4" fill="#E1261C"/>
</svg>
