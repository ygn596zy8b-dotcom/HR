<svg width="640" height="160" viewBox="0 0 640 160" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
    </filter>
  </defs>

  <!-- quiet ascending line -->
  <path d="M 40,118 C 140,108 180,96 260,90 S 380,64 440,58 S 560,40 600,34"
    fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.55"/>

  <!-- waypoint ticks -->
  <circle cx="260" cy="90" r="2.6" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="440" cy="58" r="2.6" fill="#FFFFFF" opacity="0.5"/>

  <!-- red glow behind the live-point -->
  <circle cx="600" cy="34" r="16" fill="#E1261C" opacity="0.30" filter="url(#softGlow)"/>

  <!-- live endpoint -->
  <circle cx="600" cy="34" r="4.6" fill="#E1261C"/>
  <circle cx="600" cy="34" r="4.6" fill="none" stroke="#E1261C" stroke-width="1" opacity="0.4"/>
</svg>
