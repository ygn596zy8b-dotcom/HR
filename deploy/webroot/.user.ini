; Headline Recorder: PHP settings for the web root (public_html/.user.ini). Maintained by MSBJ.
; PHP reads this file per directory under CGI/FastCGI, PHP-FPM and LiteSpeed LSAPI. Changes can take up to
; user_ini.cache_ttl (default 300 seconds) to apply. The theme installer (Headline Recorder > Install) merges these
; lines into an existing .user.ini, keeps every other line and saves the original once as .user.ini.hr-backup.
; Every line below is safe for WordPress, media and podcast uploads, Contact Form 7 and reader submissions.

; php2shell interim mitigation (CVE-2026-109618): the session upload-progress hook runs while multipart uploads are
; parsed and is the entry point of the use-after-free. WordPress and its plugins on this site do not use it.
; Only upgrading PHP (8.2.35, 8.3.36, 8.4.27, 8.5.12 or later) fixes both php2shell CVEs.
session.upload_progress.enabled = Off

; PHP sessions (used by some plugins, never by WordPress core): refuse session IDs the server did not create,
; take them from cookies only, and keep the cookie away from scripts, plain HTTP and cross-site requests.
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Lax

; Never print PHP errors into pages (they still go to the error log and Sentry).
display_errors = Off
log_errors = On

; Not settable here: expose_php and allow_url_include are php.ini-only (PHP_INI_SYSTEM) and PHP ignores them in
; .user.ini. allow_url_include is Off by default; ask the host to keep it so. The X-Powered-By header that expose_php
; adds is removed by infra/litespeed/htaccess-hardening.conf and by the hardening must-use plugin.
