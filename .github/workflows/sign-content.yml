name: Sign content (manual, offline alternative)

# Signing now happens on the server: the site signs every article the moment it is published or edited, and a
# WP-Cron sweep every 5 minutes catches anything pending (see docs/SIGNING.md). This workflow no longer runs on a
# schedule. It is kept only as a manual, offline alternative (for example while the server key is being replaced):
# it signs with the offline key and uploads through the same checks, which verify every signature before storing it.
# The secret key lives only in the HR_PQ_SIGNING_KEY secret and in $RUNNER_TEMP for the length of one step.
#
# Configure (Settings > Secrets and variables > Actions) only if you want to use it:
#   secrets   HR_PQ_SIGNING_KEY   contents of signing.secret.json (node security/pq/cli.mjs keygen sign signing)
#             HR_WP_USER          WordPress user with the "Content signer" role
#             HR_WP_APP_PASSWORD  application password of that user
#   variables HR_SITE_URL         https://headlinerecorder.com
#             HR_PQ_KID           key ID of the signing key (pinned; the job refuses any other key)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sign-content
  cancel-in-progress: false

jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check configuration
        id: config
        env:
          HAS_KEY: ${{ secrets.HR_PQ_SIGNING_KEY != '' }}
          HAS_USER: ${{ secrets.HR_WP_USER != '' }}
          HAS_PASSWORD: ${{ secrets.HR_WP_APP_PASSWORD != '' }}
          SITE: ${{ vars.HR_SITE_URL }}
          KID: ${{ vars.HR_PQ_KID }}
        run: |
          if [ "$HAS_KEY" != "true" ] || [ "$HAS_USER" != "true" ] || [ "$HAS_PASSWORD" != "true" ] || [ -z "$SITE" ] || [ -z "$KID" ]; then
            echo "::notice title=Content signing is not configured::Set secrets HR_PQ_SIGNING_KEY, HR_WP_USER, HR_WP_APP_PASSWORD and variables HR_SITE_URL, HR_PQ_KID. Nothing was signed."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.config.outputs.ready == 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.config.outputs.ready == 'true'
        with:
          node-version: 22

      - name: Install the toolkit (no install scripts, no dev tools)
        if: steps.config.outputs.ready == 'true'
        working-directory: security/pq
        run: npm ci --ignore-scripts --omit=dev

      - name: Sign and upload
        if: steps.config.outputs.ready == 'true'
        env:
          HR_PQ_SIGNING_KEY: ${{ secrets.HR_PQ_SIGNING_KEY }}
          HR_WP_USER: ${{ secrets.HR_WP_USER }}
          HR_WP_APP_PASSWORD: ${{ secrets.HR_WP_APP_PASSWORD }}
          HR_SITE_URL: ${{ vars.HR_SITE_URL }}
          HR_PQ_KID: ${{ vars.HR_PQ_KID }}
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/signing.secret.json"
          trap 'rm -f "$key_file"' EXIT
          ( umask 077 && printf '%s' "$HR_PQ_SIGNING_KEY" > "$key_file" )
          unset HR_PQ_SIGNING_KEY
          node security/pq/wp-sign.mjs --site "$HR_SITE_URL" --key "$key_file" --pin "$HR_PQ_KID"

      - name: Delete the key file
        if: always()
        run: rm -f "$RUNNER_TEMP/signing.secret.json"
